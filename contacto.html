<!DOCTYPE html>

<body>
    <header>
        <div id="logo"><a href="index.html"><img src="logo.png" alt="Logo de Angel Salazar: monograma A y S dentro de un escudo dorado"></a></div>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburguesa" aria-label="Abrir menú">&#9776;</label>
        <nav aria-label="Menú principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre-mi.html">Sobre mí</a></li>
                <li><a href="servicios.html">Servicios</a></li>

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <section class="contacto-container">
            <div class="info-contacto">
                <img src="mapa-ubicacion.jpg" alt="Mapa de Google Maps de León, Guanajuato, con la ubicación de la Universidad Tecnológica de León">
                <p>Dirección: León, Guanajuato</p>
                <p>Correo: anma13711@gmail.com</p>
                <p>Teléfono: 477 0101 010</p>
                <a class="como-llegar" href="https://www.google.com/maps/search/Universidad+Tecnologica+de+Leon" target="_blank" rel="noopener">&#128205; Cómo llegar</a>
            </div>
            <form class="formulario-contacto">
                <input type="text" name="nombre" placeholder="Nombre" aria-label="Nombre">
                <input type="email" name="correo" placeholder="Correo electrónico" aria-label="Correo electrónico">
                <textarea name="comentarios" placeholder="Comentarios" aria-label="Comentarios" rows="5"></textarea>
                <button type="submit" class="boton-primario">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="redes-sociales">
            <a href="https://facebook.com" target="_blank"><img src="icono-fb.png" alt="Icono de Facebook"></a>
            <a href="https://instagram.com" target="_blank"><img src="icono-ig.png" alt="Icono de Instagram"></a>
        </div>
        <div class="chat">
            <img src="icono-chat.png" alt="Icono de burbuja de chat">
        </div>
    </footer>
